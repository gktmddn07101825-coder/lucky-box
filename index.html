<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3174/3174175.png">
<title>럭키박스</title>
<style>
  :root {
    --bg-dark: #090014;
    --neon-pink: #ff007f;
    --neon-cyan: #00f3ff;
    --neon-yellow: #ffe600;
    --neon-purple: #a800ff;
  }
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  body {
    margin: 0;
    padding: 0;
    background-color: var(--bg-dark);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    min-height: 100vh;
    overflow: hidden;
  }

  /* 상단 헤더 */
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px;
    box-sizing: border-box;
    z-index: 10;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    color: var(--neon-cyan);
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-pink);
    margin: 0;
    letter-spacing: 2px;
    animation: discoGlow 1.2s ease-in-out infinite alternate;
  }
  @keyframes discoGlow {
    from { text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-pink); }
    to { text-shadow: 0 0 15px var(--neon-yellow), 0 0 30px var(--neon-purple); }
  }
  .btn-settings {
    background: rgba(255, 255, 255, 0.1);
    border: 2px solid var(--neon-cyan);
    color: var(--neon-cyan);
    font-size: 22px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(0, 243, 255, 0.4);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-settings:active { transform: scale(0.92); }

  /* 메인 박스 스테이지 */
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    position: relative;
    width: 100%;
  }

  .aura {
    position: absolute;
    width: 260px;
    height: 260px;
    background: radial-gradient(circle, rgba(255, 0, 127, 0.4) 0%, rgba(168, 0, 255, 0.15) 50%, transparent 70%);
    border-radius: 50%;
    animation: pulse 1.8s infinite alternate;
    pointer-events: none;
  }
  @keyframes pulse {
    0% { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.15); opacity: 1; }
  }

  .box-wrap {
    position: relative;
    width: 180px;
    height: 180px;
    cursor: pointer;
    z-index: 5;
  }
  .box-body {
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #2b0054, #120024);
    border: 4px solid var(--neon-pink);
    border-radius: 24px;
    box-shadow: 0 0 25px var(--neon-pink), inset 0 0 20px var(--neon-purple);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 75px;
    position: relative;
  }
  .box-ribbon-h {
    position: absolute;
    width: 100%;
    height: 24px;
    background: var(--neon-yellow);
    box-shadow: 0 0 10px var(--neon-yellow);
  }
  .box-ribbon-v {
    position: absolute;
    height: 100%;
    width: 24px;
    background: var(--neon-yellow);
    box-shadow: 0 0 10px var(--neon-yellow);
  }
  .box-icon {
    position: relative;
    z-index: 2;
    filter: drop-shadow(0 0 10px var(--neon-cyan));
  }

  /* 진동 애니메이션 */
  .vibrating {
    animation: discoBoxVibe 0.08s infinite !important;
  }
  @keyframes discoBoxVibe {
    0% { transform: translate(0, 0) rotate(0deg) scale(1.02); }
    25% { transform: translate(-6px, 4px) rotate(-4deg) scale(1.05); }
    50% { transform: translate(6px, -4px) rotate(4deg) scale(1.08); }
    75% { transform: translate(-4px, -6px) rotate(-2deg) scale(1.1); }
    100% { transform: translate(4px, 6px) rotate(2deg) scale(1.12); }
  }

  /* 오픈 버튼 */
  .btn-open {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    color: #fff;
    font-size: 22px;
    font-weight: 900;
    border: 2px solid var(--neon-cyan);
    border-radius: 40px;
    padding: 16px 56px;
    box-shadow: 0 0 25px var(--neon-pink), inset 0 0 10px rgba(255, 255, 255, 0.6);
    cursor: pointer;
    margin-bottom: 40px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px #000;
    z-index: 10;
  }
  .btn-open:active { transform: scale(0.94); }

  /* 폭발 충격파 링 */
  .blast-ring {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 6px solid var(--neon-cyan);
    box-shadow: 0 0 30px var(--neon-cyan);
    pointer-events: none;
    opacity: 1;
    z-index: 20;
  }
  .blast-ring.active {
    animation: blast 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }
  @keyframes blast {
    0% { transform: translate(-50%, -50%) scale(0.1); opacity: 1; border-width: 15px; }
    100% { transform: translate(-50%, -50%) scale(5); opacity: 0; border-width: 1px; }
  }

  /* 당첨 결과 모달 */
  .result-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.88);
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .result-card {
    background: linear-gradient(145deg, #1d0038, #0b0017);
    border: 3px solid var(--neon-yellow);
    border-radius: 24px;
    padding: 36px 24px;
    text-align: center;
    width: 85%;
    max-width: 320px;
    box-shadow: 0 0 45px var(--neon-yellow), inset 0 0 20px var(--neon-pink);
    animation: popResult 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.3) forwards;
  }
  @keyframes popResult {
    0% { transform: scale(0.1) rotate(-10deg); opacity: 0; }
    70% { transform: scale(1.1) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .result-title {
    color: var(--neon-cyan);
    font-size: 20px;
    font-weight: 800;
    margin: 0 0 16px;
  }
  .result-item {
    font-size: 32px;
    font-weight: 900;
    color: var(--neon-yellow);
    text-shadow: 0 0 15px var(--neon-yellow), 0 0 30px var(--neon-pink);
    margin: 16px 0 24px;
    word-break: break-all;
  }
  .result-tip {
    color: #aaa;
    font-size: 13px;
  }

  /* 관리자 설정 모달 */
  .settings-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.92);
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 16px;
    box-sizing: border-box;
  }
  .settings-card {
    width: 100%;
    max-width: 380px;
    background: #140226;
    border: 2px solid var(--neon-cyan);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
    display: flex;
    flex-direction: column;
    max-height: 85vh;
  }
  .settings-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .settings-head h3 {
    margin: 0;
    font-size: 18px;
    color: var(--neon-yellow);
    font-weight: 800;
  }
  .btn-close-modal {
    background: transparent;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
  }
  .table-head {
    display: flex;
    gap: 8px;
    font-size: 13px;
    color: #8be9fd;
    font-weight: bold;
    padding: 0 4px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .item-list {
    overflow-y: auto;
    flex: 1;
    margin: 10px 0;
    padding-right: 4px;
  }
  .item-row {
    display: flex;
    gap: 8px;
    margin-bottom: 8px;
    align-items: center;
  }
  input {
    background: #200a3b;
    border: 1px solid var(--neon-cyan);
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }
  input[type="text"] { flex: 3; }
  input[type="number"] { flex: 1.5; text-align: center; }
  .btn-del {
    background: rgba(255, 71, 87, 0.25);
    border: 1px solid #ff4757;
    color: #ff4757;
    border-radius: 8px;
    padding: 8px 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-add {
    background: transparent;
    border: 1.5px dashed var(--neon-cyan);
    color: var(--neon-cyan);
    font-weight: bold;
    font-size: 14px;
    padding: 10px;
    border-radius: 8px;
    margin-top: 4px;
    cursor: pointer;
  }
  .btn-save {
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
    cursor: pointer;
    box-shadow: 0 0 15px var(--neon-pink);
  }

  /* 인앱 토스트 알림 */
  .toast {
    display: none;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: #00f3ff;
    color: #000;
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 14px;
    z-index: 300;
    box-shadow: 0 0 15px #00f3ff;
  }

  canvas#confettiCanvas {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 150;
  }
</style>
</head>
<body>

<header>
  <h1>DISCO PANG PANG</h1>
  <button type="button" class="btn-settings" id="settingBtn">⚙️</button>
</header>

<div class="stage">
  <div class="aura"></div>
  <div class="blast-ring" id="blastRing"></div>
  
  <div class="box-wrap" id="boxWrap">
    <div class="box-body">
      <div class="box-ribbon-h"></div>
      <div class="box-ribbon-v"></div>
      <div class="box-icon">🎁</div>
    </div>
  </div>
</div>

<button type="button" class="btn-open" id="openBtn">OPEN!</button>

<div class="result-overlay" id="resultModal">
  <div class="result-card">
    <div class="result-title">🎉 당첨 결과 🎉</div>
    <div class="result-item" id="resultText">대박 상품</div>
    <div class="result-tip">화면을 터치하면 닫힙니다</div>
  </div>
</div>

<div class="settings-modal" id="settingsModal">
  <div class="settings-card">
    <div class="settings-head">
      <h3>🎁 품목 및 확률 설정</h3>
      <button type="button" class="btn-close-modal" id="closeSettingsBtn">✕</button>
    </div>
    <div class="table-head">
      <span style="flex: 3;">상품명</span>
      <span style="flex: 1.5; text-align: center;">가중치(확률)</span>
      <span style="width: 38px; text-align: center;">삭제</span>
    </div>
    <div class="item-list" id="itemList"></div>
    <button type="button" class="btn-add" id="addBtn">+ 품목 추가하기</button>
    <button type="button" class="btn-save" id="saveBtn">저장 및 적용</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<canvas id="confettiCanvas"></canvas>

<script>
// ⭐ 여기가 사장님 맞춤형으로 고정된 기본 세팅입니다. ⭐
var defaultItems = [
  { name: '티켓', weight: 81 },
  { name: '인생네컷 ', weight: 6 },
  { name: '호출권', weight: 6 },
  { name: '증명사진', weight: 6 },
  { name: '(꽝)', weight: 1 }
];

// 접속할 때마다 항상 위 설정값으로 시작하도록 덮어쓰기 방지
var items = defaultItems;
var storageKey = 'lucky_box_items_v2'; // 캐시 방지용 이름 변경

try {
  var saved = localStorage.getItem(storageKey);
  if (saved) {
    items = JSON.parse(saved);
  }
} catch (e) {
  console.log('Storage error');
}

var isOpening = false;

function showToast(msg) {
  var t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}

function handleOpenBox() {
  if (isOpening) return;
  isOpening = true;

  var box = document.getElementById('boxWrap');
  var ring = document.getElementById('blastRing');
  
  box.classList.add('vibrating');

  setTimeout(function() {
    box.classList.remove('vibrating');
    ring.classList.add('active');
    
    explodeParticles();

    var winner = pickWinner();

    setTimeout(function() {
      ring.classList.remove('active');
      document.getElementById('resultText').innerText = winner;
      document.getElementById('resultModal').style.display = 'flex';
      isOpening = false;
    }, 350);

  }, 1600);
}

function pickWinner() {
  var totalWeight = 0;
  for (var i = 0; i < items.length; i++) {
    totalWeight += Number(items[i].weight);
  }
  var random = Math.random() * totalWeight;

  for (var j = 0; j < items.length; j++) {
    if (random < items[j].weight) {
      return items[j].name;
    }
    random -= items[j].weight;
  }
  return items[items.length - 1].name;
}

function openSettings() {
  renderSettingsList();
  document.getElementById('settingsModal').style.display = 'flex';
}

function closeSettings() {
  document.getElementById('settingsModal').style.display = 'none';
}

function renderSettingsList() {
  var list = document.getElementById('itemList');
  list.innerHTML = '';
  items.forEach(function(item, index) {
    var row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = '<input type="text" class="item-name" value="' + item.name + '" placeholder="상품명">' +
                    '<input type="number" class="item-weight" min="1" value="' + item.weight + '" placeholder="가중치">' +
                    '<button type="button" class="btn-del" data-idx="' + index + '">✕</button>';
    list.appendChild(row);
  });

  var delBtns = list.querySelectorAll('.btn-del');
  delBtns.forEach(function(btn) {
    btn.onclick = function() {
      var idx = parseInt(this.getAttribute('data-idx'));
      if (items.length <= 1) {
        showToast('최소 1개 이상의 상품이 있어야 합니다.');
        return;
      }
      items.splice(idx, 1);
      renderSettingsList();
    };
  });
}

function addItemRow() {
  items.push({ name: '새 상품 ' + (items.length + 1), weight: 1 });
  renderSettingsList();
}

function saveSettings() {
  var nameInputs = document.querySelectorAll('.item-name');
  var weightInputs = document.querySelectorAll('.item-weight');
  var updatedItems = [];

  for (var i = 0; i < nameInputs.length; i++) {
    var name = nameInputs[i].value.trim() || '상품';
    var weight = Math.max(1, parseInt(weightInputs[i].value) || 1);
    updatedItems.push({ name: name, weight: weight });
  }

  items = updatedItems;
  try {
    localStorage.setItem(storageKey, JSON.stringify(items));
  } catch (e) {}

  showToast('설정이 적용되었습니다!');
  closeSettings();
}

var pCanvas = document.getElementById('confettiCanvas');
var pCtx = pCanvas.getContext('2d');
var particles = [];
var animId = null;

function resizeCanvas() {
  pCanvas.width = window.innerWidth;
  pCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function explodeParticles() {
  particles = [];
  var colors = ['#ff007f', '#00f3ff', '#ffe600', '#a800ff', '#ffffff'];
  var centerX = window.innerWidth / 2;
  var centerY = window.innerHeight / 2;

  for (var i = 0; i < 120; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = Math.random() * 16 + 4;
    particles.push({
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 7 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      decay: Math.random() * 0.015 + 0.008
    });
  }

  if (animId) cancelAnimationFrame(animId);

  function update() {
    pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
    particles.forEach(function(p) {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.3;
      p.vx *= 0.98;
      p.alpha -= p.decay;

      pCtx.fillStyle = p.color;
      pCtx.globalAlpha = Math.max(0, p.alpha);
      pCtx.fillRect(p.x, p.y, p.size, p.size);
    });

    particles = particles.filter(function(p) { return p.alpha > 0; });
    if (particles.length > 0) {
      animId = requestAnimationFrame(update);
    }
  }
  update();
}

document.getElementById('openBtn').addEventListener('click', handleOpenBox);
document.getElementById('boxWrap').addEventListener('click', handleOpenBox);
document.getElementById('settingBtn').addEventListener('click', openSettings);
document.getElementById('closeSettingsBtn').addEventListener('click', closeSettings);
document.getElementById('addBtn').addEventListener('click', addItemRow);
document.getElementById('saveBtn').addEventListener('click', saveSettings);
document.getElementById('resultModal').addEventListener('click', function() {
  this.style.display = 'none';
  if (animId) cancelAnimationFrame(animId);
  pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
});
</script>
</body>
</html>
